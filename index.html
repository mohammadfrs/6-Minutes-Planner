<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6-Minute Journal</title>
<meta name="theme-color" content="#1f5a66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Journal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap">
<style>
/* Layout: one centred journal sheet (max 46rem) under a sticky header with a tab strip; sections numbered like the book's 8-step routine */
:root{
  --paper:#eceff0; --sheet:#fbfcfb; --ink:#1c2427; --muted:#5b676a; --line:#d3d9da; --rule:#e2e7e8;
  --accent:#1f5a66; --accent-ink:#ffffff; --accent-soft:#dbe9ec; --gold:#9c6a12; --gold-soft:#f3e7cc;
  --good:#2c7748; --good-soft:#dcefe2; --warn:#a8591a; --bad:#a3303d; --bad-soft:#f6dfe2;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111618; --sheet:#182023; --ink:#e4eaeb; --muted:#97a4a7; --line:#2b3639; --rule:#243033;
  --accent:#74b4c0; --accent-ink:#0d1a1d; --accent-soft:#1d3237; --gold:#d8a94c; --gold-soft:#3a2f18;
  --good:#6cc18c; --good-soft:#1b3326; --warn:#e2995a; --bad:#e3788a; --bad-soft:#3a1d22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111618; --sheet:#182023; --ink:#e4eaeb; --muted:#97a4a7; --line:#2b3639; --rule:#243033;
  --accent:#74b4c0; --accent-ink:#0d1a1d; --accent-soft:#1d3237; --gold:#d8a94c; --gold-soft:#3a2f18;
  --good:#6cc18c; --good-soft:#1b3326; --warn:#e2995a; --bad:#e3788a; --bad-soft:#3a1d22; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:46rem;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:600;letter-spacing:-.01em}
.brand b span{color:var(--accent)}
.status{border:0;background:transparent;font-size:.78rem;color:var(--muted);padding:4px 0;cursor:default;white-space:nowrap}
.status[data-s="error"]{color:var(--bad);cursor:pointer;text-decoration:underline}
.status[data-s="saving"]{color:var(--gold)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:8px 12px 10px;font-weight:600;font-size:.92rem;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

.wrap{max-width:46rem;margin:0 auto;padding-inline:16px;padding-block:18px 64px;display:flex;flex-direction:column;gap:16px}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:20px 18px;display:flex;flex-direction:column;gap:22px;min-width:0}
.banner{border:1px solid var(--gold);background:var(--gold-soft);border-radius:4px;padding:10px 14px;font-size:.88rem}

h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.35rem}
h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* day head */
.dhead{display:flex;flex-direction:column;gap:8px}
.wd{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.wd li{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:600;color:var(--muted);border:1px solid transparent}
.wd li.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.date{font-size:1.6rem;line-height:1.2}
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.chip.locked{background:var(--rule);color:var(--muted)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.quote{margin:0;padding:10px 0 0;border-top:1px solid var(--rule)}
.quote p{font-family:var(--f-display);font-style:italic;font-size:1rem}
.quote cite{font-style:normal;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.daynav{display:flex;gap:6px;align-items:center}

/* numbered sections */
.sec{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px}
.num{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:.78rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.sec.eve .num{border-color:var(--gold);color:var(--gold)}
.sec-b{display:flex;flex-direction:column;gap:4px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec-h h3 small{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);margin-left:6px}
.part{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0 2px;border-top:1px dashed var(--line)}
.part:first-of-type{border-top:0}

input.line,select.line{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:7px 2px;font-size:16px;border-radius:0;min-width:0}
input.line:focus{border-bottom-color:var(--accent);outline:none}
select.line{padding:6px 2px;color:var(--ink)}
textarea.lined{width:100%;border:0;resize:vertical;font-size:16px;line-height:32px;padding:0 2px;min-height:96px;background-color:transparent;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);background-attachment:local}
textarea.lined:focus{outline:none;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--accent-soft) 31px,var(--accent-soft) 32px)}
:disabled{opacity:1}
input:disabled,textarea:disabled,select:disabled{color:var(--ink);-webkit-text-fill-color:var(--ink)}

.item{display:flex;align-items:center;gap:8px;min-width:0}
.item input[type=checkbox]{flex:none}
.item.done input.line{text-decoration:line-through;color:var(--muted);-webkit-text-fill-color:var(--muted)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin:0}
.carried{flex:none;font-size:.72rem;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.x{flex:none;border:0;background:none;color:var(--muted);font-size:1.2rem;width:28px;height:28px;cursor:pointer;border-radius:50%}
.x:hover{background:var(--rule)}
.focus-box{border:1.5px solid var(--accent);border-radius:4px;padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px}
.focus-box .item input.line{font-weight:600;border-bottom:0}
.tags{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tags label{display:flex;flex-direction:column;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;min-width:0}

.rating{display:flex;gap:6px;flex-wrap:wrap}
.rating button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.rating button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--sheet)}
.habits{display:flex;flex-direction:column;gap:6px}
.habits label{display:flex;gap:10px;align-items:center}

.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:4px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec2{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad);color:var(--sheet)}
.ghost{border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:6px 12px;cursor:pointer;font-weight:600;min-width:38px}
.ghost:disabled{opacity:.4;cursor:default}
.ghost.small{font-size:.85rem}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.finish{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.confirm{background:var(--accent-soft);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.score-line{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.score-line strong{font-family:var(--f-display);font-size:1.6rem}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:10px 0}

/* week */
.cal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.cal label{display:flex;flex-direction:column;gap:2px;min-width:0}
.cal textarea.lined{min-height:64px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--rule);font-size:.88rem}
th:first-child,td:first-child{text-align:left}
th{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
td.today-col,th.today-col{background:var(--accent-soft)}
.wfocus{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wfocus li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.wfocus li span:first-child{font-weight:700;color:var(--muted);font-size:.8rem}

/* values */
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:.86rem;cursor:pointer}
.vchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vchip.star[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--sheet)}
.vchip:disabled{opacity:.4;cursor:default}
.pairs{display:flex;flex-direction:column;gap:6px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pair button{border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:8px;cursor:pointer;font-size:.88rem;min-width:0}
.pair button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.pair span{font-size:.75rem;color:var(--muted)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rank li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.rank .n{font-family:var(--f-display);font-weight:700;font-size:1.1rem;color:var(--accent)}
.tally{font-family:var(--f-display);letter-spacing:.12em;color:var(--muted);font-size:.9rem;margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:5px 9px;font-size:.78rem;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.area-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.area-grid label{display:flex;flex-direction:column;gap:2px;min-width:0}
.area-grid .q{font-size:.8rem;color:var(--muted)}

/* progress */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:2px solid var(--accent)}
.kpi strong{font-family:var(--f-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .b-good{fill:var(--accent)}
.chart .b-mid{fill:var(--gold)}
.chart .b-low{fill:var(--bad)}
.chart .miss{fill:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 3.2rem;gap:10px;align-items:center;font-size:.88rem;padding:4px 0}
.hbar .track{height:10px;background:var(--rule);border-radius:2px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:2px}
.hbar .fill.warnf{background:var(--bad)}
.hbar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.insights{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.insights li.bad::marker{color:var(--bad)}
.insights li.good::marker{color:var(--good)}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--accent)}
.ai-out{font-size:.95rem;display:flex;flex-direction:column;gap:8px;max-width:65ch}
.ai-out h4{font-family:var(--f-display);font-size:1.02rem;margin:8px 0 0}
.ai-out ul,.ai-out ol{margin:0;padding-left:20px}
.err{color:var(--bad);font-size:.88rem}
details summary{cursor:pointer;font-weight:600}

/* history */
.month{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;cursor:pointer;width:100%}
.hrow:hover{background:var(--accent-soft)}
.hrow .d{font-weight:700;font-variant-numeric:tabular-nums}
.hrow .d small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.hrow .f{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-variant-numeric:tabular-nums;font-weight:700;border-radius:4px;padding:2px 8px;font-size:.82rem}
.sc.g{background:var(--accent-soft);color:var(--accent)} .sc.m{background:var(--gold-soft);color:var(--gold)} .sc.l{background:var(--bad-soft);color:var(--bad)}
textarea.code{width:100%;min-height:140px;font-family:ui-monospace,Consolas,monospace;font-size:12px;border:1px solid var(--line);background:var(--paper);padding:8px}

@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .area-grid,.cal{grid-template-columns:minmax(0,1fr)}
  .tags{grid-template-columns:minmax(0,1fr)}
  .sheet{padding:16px 14px}
  .date{font-size:1.35rem}
  .hbar{grid-template-columns:minmax(0,6.5rem) minmax(0,1fr) 3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>6-Minute <span>Journal</span></b><button id="status" class="status" data-act="retry" data-s="idle"></button></div>
    <nav class="tabs" aria-label="Sections">
      <button data-tab="day">Day</button>
      <button data-tab="week">Week</button>
      <button data-tab="progress">Progress</button>
      <button data-tab="me">Vision &amp; values</button>
      <button data-tab="history">Archive</button>
    </nav>
  </div>
</header>
<main id="main" class="wrap"><p class="loading">Opening your journal…</p></main>

<script>
(()=>{
'use strict';
/* ---------- constants ---------- */
const AREAS=[
 ['body','Body & mind','How is my physical and mental health?'],
 ['career','Education & career','Where do I stand at work? What am I learning?'],
 ['family','Family & friends','How is my family? Which friends are with me?'],
 ['attitude','Attitude','How do I approach life? What is my motto?'],
 ['finance','Finances','How am I set up financially?'],
 ['leisure','Leisure & fun','What do I do just for the joy of it?']];
const AREA=Object.fromEntries(AREAS.map(a=>[a[0],a[1]]));
const VALUES=['Adventure','Mindfulness','Activity','Acceptance','Reputation','Aesthetics','Authenticity','Balance','Enthusiasm','Modesty','Charm','Coolness','Gratitude','Directness','Effectiveness','Honour','Honesty','Simplicity','Insight','Empathy','Success','Excellence','Fairness','Imagination','Flexibility','Progress','Freedom','Patience','Composure','Health','Generosity','Challenge','Harmony','Humour','Innovation','Intelligence','Intuition','Creativity','Passion','Love','Loyalty','Sustainability','Compassion','Curiosity','Objectivity','Openness','Optimism','Perfection','Professionalism','Realism','Respect','Calm','Self-confidence','Security','Diligence','Spirituality','Fun','Strength','Team spirit','Tradition','Independence','Vitality','Responsibility','Reliability','Trust','Forgiveness','Wisdom','Willpower','Prosperity','Belonging','Determination'];
const QUOTES=[
 ['The successful warrior is the average man, with laser-like focus.','Bruce Lee'],
 ['The art of resting is a part of the art of working.','John Steinbeck'],
 ['Nothing happens without risk, but without risk nothing happens.','Walter Scheel'],
 ['Well done is better than well said.','Benjamin Franklin'],
 ['It always seems impossible until it is done.','Nelson Mandela'],
 ['The best way out is always through.','Robert Frost'],
 ['Do what you can, with what you have, where you are.','Theodore Roosevelt'],
 ['We are what we repeatedly do.','Will Durant'],
 ['Nothing will work unless you do.','Maya Angelou'],
 ['Energy and persistence conquer all things.','Benjamin Franklin'],
 ['Knowing is not enough; we must apply.','J. W. von Goethe'],
 ['The journey of a thousand miles begins with one step.','Lao Tzu'],
 ['Rest is not idleness.','John Lubbock'],
 ['Focus on being productive instead of busy.','Tim Ferriss'],
 ['Done is better than perfect.','Sheryl Sandberg'],
 ['Whatever you are, be a good one.','Abraham Lincoln'],
 ['Happiness is not something ready made. It comes from your own actions.','Dalai Lama'],
 ['Vision is the art of seeing what is invisible to others.','Jonathan Swift'],
 ['Life can only be understood backwards; but it must be lived forwards.','Søren Kierkegaard'],
 ['He who has a why to live can bear almost any how.','Friedrich Nietzsche'],
 ['Small deeds done are better than great deeds planned.','Peter Marshall'],
 ['Start where you are. Use what you have. Do what you can.','Arthur Ashe'],
 ['You cannot lengthen or widen your life, only deepen it.','Gorch Fock'],
 ['Visions are the archive of the future.','Thom Renzie'],
 ['Simplicity is the ultimate sophistication.','Leonardo da Vinci'],
 ['Courage is grace under pressure.','Ernest Hemingway'],
 ['What gets measured gets managed.','Peter Drucker'],
 ['Little by little, one travels far.','J. R. R. Tolkien'],
 ['Action is the foundational key to all success.','Pablo Picasso'],
 ['Quality is not an act, it is a habit.','Will Durant']];
const WD=['M','T','W','T','F','S','S'];
const CAL=[['mon','Monday'],['tue','Tuesday'],['wed','Wednesday'],['thu','Thursday'],['fri','Friday'],['wkd','Saturday / Sunday']];
const COLS=['days','weeks','meta','reviews'];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const filled=v=>String(v??'').trim().length>0;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const todayStr=()=>ymd(new Date());
const dow=s=>(parse(s).getDay()+6)%7;
const mondayOf=s=>addDays(s,-dow(s));
const dayIndex=s=>Math.round(parse(s).getTime()/864e5);
function isoWeek(s){const d=parse(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);
  const wk=1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7);return `${d.getFullYear()}-W${pad(wk)}`;}
const fmtLong=s=>parse(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtShort=s=>parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const pct=(a,b)=>b?Math.round(100*a/b):null;
const pctTxt=v=>v==null?'–':v+'%';
function setPath(o,path,val){const ks=path.split('.');let x=o;for(let i=0;i<ks.length-1;i++){const k=ks[i];if(x[k]==null||typeof x[k]!=='object')x[k]={};x=x[k];}x[ks[ks.length-1]]=val;}

function rankedValues(){

async function pool(items,n,fn){let i=0;await Promise.all([...Array(Math.min(n,items.length))].map(async()=>{while(i<items.length){const it=items[i++];await fn(it);}}));}
function graphStore(){
  const enc=p=>p.split('/').map(encodeURIComponent).join('/');
  const root='/me/drive/special/approot:/';
  let cache={};try{cache=JSON.parse(localStorage.getItem('smj6:gcache')||'{}');}catch(e){}
  const keep=()=>{try{localStorage.setItem('smj6:gcache',JSON.stringify(cache));}catch(e){}};
  async function put(rel,text){
    const r=await graph(`${root}${enc(rel)}:/content`,{method:'PUT',headers:{'Content-Type':'text/plain'},body:text});
    if(!r.ok) throw new Error('OneDrive save failed ('+r.status+')');
    return r.json();
  }
  return{
    async all(c){
      let url=`${root}data/${c}:/children?$select=name,eTag,file,@microsoft.graph.downloadUrl&$top=999`, items=[];
      while(url){const r=await graph(url);if(r.status===404) break;if(!r.ok) throw new Error('OneDrive list failed ('+r.status+')');
        const j=await r.json();items.push(...j.value);url=j['@odata.nextLink']?j['@odata.nextLink'].replace('https://graph.microsoft.com/v1.0',''):null;}
      items=items.filter(it=>it.file&&it.name.endsWith('.json'));
      const out=[], seen=new Set();
      await pool(items,6,async it=>{const k=c+'/'+it.name;seen.add(k);let text;
        if(cache[k]&&cache[k].etag===it.eTag) text=cache[k].text;
        else{const r=await fetch(it['@microsoft.graph.downloadUrl']);text=await r.text();cache[k]={etag:it.eTag,text};}
        try{out.push({id:it.name.slice(0,-5),data:JSON.parse(text)});}catch(e){console.warn('Skipped unreadable file',k);}});
      for(const k of Object.keys(cache)) if(k.startsWith(c+'/')&&!seen.has(k)) delete cache[k];
      keep();return out;},
    async set(c,id,data){const text=JSON.stringify(data,null,2);const j=await put(`data/${c}/${id}.json`,text);cache[`${c}/${id}.json`]={etag:j.eTag,text};keep();},
    async del(c,id){await graph(`${root}${enc(`data/${c}/${id}.json`)}`,{method:'DELETE'});delete cache[`${c}/${id}.json`];keep();},
    async writeText(path,name,text){await put(`${path}/${name}`,text);}
  };
}

function fsStore(root){

    if(cache[path]) return cache[path];
    let h=root;for(const p of path.split('/')) h=await h.getDirectoryHandle(p,{create:true});

const saveQ={};
function scheduleSave(col,id,delay=700){
  const k=col+'/'+id, q=saveQ[k]||(saveQ[k]={});
  clearTimeout(q.timer); q.dirty=true; setStatus('saving');
  q.timer=setTimeout(()=>flush(col,id),delay);
}
async function flush(col,id){
  const k=col+'/'+id, q=saveQ[k]; if(!q) return;
  clearTimeout(q.timer); q.timer=null;
  if(q.inflight){q.again=true;return;}
  const data=S[col].get(id); if(!data){delete saveQ[k];return;}
  q.inflight=true; q.dirty=false;
  try{data.updatedAt=Date.now();await store.set(col,id,JSON.parse(JSON.stringify(data)));
    if(col==='days'&&dayStats(data,profile().habits).journaled) await store.writeText('pages',`${id.replaceAll('-','')}-Journal-Day Page-v1.md`,dayMarkdown(data));
    q.failed=false;}
  catch(e){console.warn('save failed',e);q.dirty=true;q.failed=true;
    setStatus('error',CLOUD_MODE?(e&&e.code==='auth'?'Your sign-in expired. Tap to sign in again; your changes are kept.':'No connection to OneDrive. Your changes stay on screen; tap to try again.')
      :'Saving to the folder failed. Check that the folder still exists, then tap to try again.');}
  q.inflight=false;
  if(q.again){q.again=false;return flush(col,id);}
  if(!q.dirty&&!q.timer) delete saveQ[k];
  refreshStatus();
}
function refreshStatus(){
  const qs=Object.values(saveQ);
  if(qs.some(q=>q.failed&&q.dirty)) return setStatus('error','Saving failed. Tap to try again.');
  if(qs.length) return setStatus('saving');
  setStatus('saved');
}
function setStatus(s,msg){const el=$('#status');if(!el)return;

/* ---------- day lifecycle ---------- */
function carry(from,to){
  if(from.carriedTo) return;
  const have=new Set([to.focus.text,...to.cream.map(t=>t.text),...to.cherries.map(t=>t.text)].map(s=>String(s).trim().toLowerCase()).filter(Boolean));
  const items=[];
  if(filled(from.focus.text)&&!from.focus.done) items.push({text:from.focus.text,carried:(from.focus.carried||0)+1,focus:true,area:from.focus.area,value:from.focus.value});
  for(const t of [...from.cream,...from.cherries]) if(filled(t.text)&&!t.done) items.push({text:t.text,carried:(t.carried||0)+1});
  for(const it of items){
    if(have.has(it.text.trim().toLowerCase())) continue;
    if(it.focus&&!filled(to.focus.text)){Object.assign(to.focus,{text:it.text,done:false,carried:it.carried,area:it.area||'',value:it.value||''});continue;}
    const t={text:it.text,done:false,carried:it.carried};
    const slot=to.cream.find(c=>!filled(c.text));
    if(slot) Object.assign(slot,t); else to.cherries.push(t);
  }
  from.carriedTo=to.date;
}
function ensureTimeline(){
  const t=todayStr(); S.date=t;
  const dates=[...S.days.keys()].sort();
  for(const d of dates){const x=S.days.get(d);if(d<t&&x.status==='open'){x.status='closed';x.closedAt=Date.now();scheduleSave('days',d,60);}}
  if(!S.days.has(t)){
    const day=newDay(t); const prev=dates.filter(d=>d<t).pop();
    if(prev){carry(S.days.get(prev),day);scheduleSave('days',prev,60);}
    S.days.set(t,day); scheduleSave('days',t,60);
  }
  const open=[...S.days.keys()].sort().filter(d=>d>=t&&S.days.get(d).status==='open');
  S.cur=open[0]||t; S.weekMon=mondayOf(S.cur);
}
function maxDate(){const ks=[...S.days.keys()].sort();const last=ks[ks.length-1]||S.date;const tm=addDays(S.date,1);return last>tm?last:tm;}
function checkDate(){if(S.date&&todayStr()!==S.date){ensureTimeline();render();}}

/* ---------- scoring & analysis ---------- */
function dayStats(d,habits){
  const todos=[...d.cream,...d.cherries].filter(t=>filled(t.text));
  const cream=d.cream.filter(t=>filled(t.text));
  const relax=d.relax.filter(t=>filled(t.text));
  const ev=d.evening;
  const morning=filled(d.focus.text)||d.grateful.some(filled)||cream.length>0;
  const evening=filled(ev.win)||filled(ev.moment)||filled(ev.learned)||ev.rating>0;
  const hDone=habits.filter(h=>d.habits[h.id]).length;
  const focusSet=filled(d.focus.text);
  let pts=0;const max=40+20+15+(habits.length?15:0)+10;
  if(focusSet&&d.focus.done) pts+=40;
  if(cream.length) pts+=20*cream.filter(t=>t.done).length/cream.length;
  if(relax.some(t=>t.done)) pts+=15;
  if(habits.length) pts+=15*hDone/habits.length;
  if(evening) pts+=10;
  return{journaled:morning||evening,morning,evening,focusSet,focusDone:focusSet&&d.focus.done,
    todos:todos.length,todosDone:todos.filter(t=>t.done).length,cream:cream.length,creamDone:cream.filter(t=>t.done).length,
    relax:relax.length,relaxDone:relax.filter(t=>t.done).length,hDone,hTotal:habits.length,rating:ev.rating||0,
    score:Math.round(100*pts/max)};
}
function analyse(range){
  const t=S.date, p=profile(), habits=p.habits;
  const first=[...S.days.keys()].sort()[0]||t;
  let start=range==='all'?first:addDays(t,-(range-1));
  const days=[];for(let d=start;d<=t;d=addDays(d,1)){const doc=S.days.get(d);days.push({date:d,doc,s:doc?dayStats(doc,habits):null});}
  const J=days.filter(x=>x.s&&x.s.journaled);
  const sum=f=>J.reduce((a,x)=>a+f(x.s),0);
  const r={range,label:range==='all'?'all time':`the last ${range} days`,days,n:days.length,journaled:J.length};
  r.focusSet=sum(s=>s.focusSet?1:0); r.focusDone=sum(s=>s.focusDone?1:0);
  r.todos=sum(s=>s.todos); r.todosDone=sum(s=>s.todosDone); r.cream=sum(s=>s.cream); r.creamDone=sum(s=>s.creamDone);
  r.relaxDays=sum(s=>s.relaxDone>0?1:0); r.evenings=sum(s=>s.evening?1:0); r.mornings=sum(s=>s.morning?1:0);
  const rated=J.filter(x=>x.s.rating>0); r.ratingAvg=rated.length?(rated.reduce((a,x)=>a+x.s.rating,0)/rated.length):null;
  r.scoreAvg=days.length?Math.round(days.reduce((a,x)=>a+(x.s&&x.s.journaled?x.s.score:0),0)/days.length):0;
  // streak
  let k=0,d=t;const jd=x=>{const doc=S.days.get(x);return doc&&dayStats(doc,habits).journaled;};
  if(!jd(d)) d=addDays(d,-1); while(jd(d)){k++;d=addDays(d,-1);} r.streak=k;
  // habits
  r.habits=habits.map(h=>{let done=0;for(const x of J) if(x.doc.habits[h.id]) done++;
    let st=0,dd=t;const on=x=>{const doc=S.days.get(x);return !!(doc&&doc.habits[h.id]);};if(!on(dd))dd=addDays(dd,-1);while(on(dd)){st++;dd=addDays(dd,-1);}
    const last=[];for(let i=13;i>=0;i--){last.push(on(addDays(t,-i)));}
    return{id:h.id,name:h.name||'Unnamed habit',done,rate:pct(done,J.length),streak:st,last};});
  // areas & values of focus tasks
  r.areas=AREAS.map(([id,name])=>{const xs=J.filter(x=>x.s.focusSet&&x.doc.focus.area===id);return{id,name,n:xs.length,done:xs.filter(x=>x.doc.focus.done).length,vision:filled(p.vision.areas[id])};});
  r.untagged=J.filter(x=>x.s.focusSet&&!x.doc.focus.area).length;
  const vals=rankedValues().map(v=>v.name);
  r.values=vals.map(v=>({name:v,n:J.filter(x=>x.s.focusSet&&x.doc.focus.value===v).length,more:p.values.status[v]==='more'}));
  // chronic carry-overs
  const carriedMap={};
  for(const x of days){if(!x.doc)continue;const its=[{...x.doc.focus},...x.doc.cream,...x.doc.cherries];
    for(const it of its){if(filled(it.text)&&(it.carried||0)>=3&&!it.done){const key=it.text.trim();carriedMap[key]=Math.max(carriedMap[key]||0,it.carried);}}}
  r.chronic=Object.entries(carriedMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // weeks
  const wk={};for(const x of days){const m=mondayOf(x.date);(wk[m]=wk[m]||[]).push(x);}
  r.weeks=Object.entries(wk).sort((a,b)=>a[0]<b[0]?1:-1).map(([m,xs])=>{const j=xs.filter(x=>x.s&&x.s.journaled);
    const f=j.filter(x=>x.s.focusSet),fd=f.filter(x=>x.s.focusDone);const td=j.reduce((a,x)=>a+x.s.todos,0),tdd=j.reduce((a,x)=>a+x.s.todosDone,0);
    return{monday:m,id:isoWeek(m),days:xs.length,journaled:j.length,focus:pct(fd.length,f.length),todos:pct(tdd,td),score:Math.round(xs.reduce((a,x)=>a+(x.s&&x.s.journaled?x.s.score:0),0)/xs.length)};});
  r.insights=insights(r,p);
  return r;
}
function insights(r,p){
  const out=[];
  if(!r.journaled){out.push(['bad','No entries yet in this period. Fill in the morning part of today\'s page to start.']);return out;}
  const fr=pct(r.focusDone,r.focusSet);
  out.push([r.journaled/r.n>=0.8?'good':'bad',`You journaled on ${r.journaled} of ${r.n} days (${pct(r.journaled,r.n)}%). Current streak: ${r.streak} day${r.streak===1?'':'s'}.`]);
  if(r.focusSet) out.push([fr>=70?'good':'bad',`You completed your daily focus on ${r.focusDone} of ${r.focusSet} days (${fr}%).${fr<70?' Pick a smaller, clearer focus task that you can finish before noon.':''}`]);
  if(r.focusSet<r.journaled) out.push(['bad',`On ${r.journaled-r.focusSet} journaled days you set no daily focus. The focus task is the core of the method.`]);
  if(r.evenings<r.journaled*0.6) out.push(['bad',`Evening reflection was filled on only ${r.evenings} of ${r.journaled} days. Two minutes before sleep is enough.`]);
  if(r.relaxDays<r.journaled*0.5) out.push(['bad',`You finished a to-relax item on ${r.relaxDays} of ${r.journaled} days. Rest is part of the plan, so schedule it like a meeting.`]);
  else out.push(['good',`You made time to relax on ${r.relaxDays} of ${r.journaled} days.`]);
  const neglected=r.areas.filter(a=>a.vision&&a.n===0).map(a=>a.name);
  if(neglected.length) out.push(['bad',`Your vision covers ${neglected.join(', ')}, but no daily focus served ${neglected.length>1?'these areas':'this area'}.`]);
  const top=r.areas.slice().sort((a,b)=>b.n-a.n)[0]; if(top&&top.n) out.push(['good',`Most of your focus went to ${top.name} (${top.n} day${top.n===1?'':'s'}).`]);
  const more=r.values.filter(v=>v.more);
  for(const v of more) out.push([v.n?'good':'bad',`You want to live "${v.name}" more. ${v.n?`${v.n} focus task${v.n===1?' was':'s were'} tagged with it.`:'No focus task was tagged with it yet.'}`]);
  for(const [t,n] of r.chronic.slice(0,3)) out.push(['bad',`"${t}" has moved forward ${n} times. Do it first tomorrow, delegate it, or drop it.`]);
  for(const h of r.habits) if(h.rate!=null&&h.rate<50) out.push(['bad',`Habit "${h.name}" was done on ${h.rate}% of journaled days.`]);
  return out;
}

function scoreChart(days){
  const n=days.length;if(!n)return'';
  const W=Math.max(300,Math.min(680,(window.innerWidth||680)-64)),H=170,pl=30,pr=6,pt=10,pb=24,iw=W-pl-pr,ih=H-pt-pb,step=iw/n,bw=Math.max(2,Math.min(18,step*0.7));
  let g='';
  for(const v of [0,50,100]){const y=pt+ih-ih*v/100;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" class="grid"/><text x="${pl-6}" y="${y+4}" class="axis" text-anchor="end">${v}</text>`;}
  const every=Math.max(1,Math.ceil(n/6));
  days.forEach((x,i)=>{const cx=pl+step*i+step/2;const sc=x.s&&x.s.journaled?x.s.score:null;
    if(sc==null) g+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${pt+ih-2}" width="${bw.toFixed(1)}" height="2" class="miss"><title>${fmtShort(x.date)}: no entry</title></rect>`;
    else{const hh=Math.max(2,ih*sc/100);g+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${(pt+ih-hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="1.5" class="${sc>=70?'b-good':sc>=40?'b-mid':'b-low'}"><title>${fmtShort(x.date)}: score ${sc}</title></rect>`;}
    if(i%every===0||i===n-1){if(i!==n-1&&n-1-i<every*0.6)return;g+=`<text x="${cx.toFixed(1)}" y="${H-6}" class="axis" text-anchor="middle">${esc(fmtShort(x.date))}</text>`;}
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Daily score per day">${g}</svg>`;
}

function md(t){
  const lines=esc(t).split('\n');let out='',list=null;
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const close=()=>{if(list){out+=`</${list}>`;list=null;}};
  for(const raw of lines){const l=raw.trim();
    if(/^#{1,4}\s/.test(l)){close();out+=`<h4>${inline(l.replace(/^#{1,4}\s/,''))}</h4>`;}
    else if(/^[-*•]\s/.test(l)){if(list!=='ul'){close();out+='<ul>';list='ul';}out+=`<li>${inline(l.replace(/^[-*•]\s/,''))}</li>`;}
    else if(/^\d+[.)]\s/.test(l)){if(list!=='ol'){close();out+='<ol>';list='ol';}out+=`<li>${inline(l.replace(/^\d+[.)]\s/,''))}</li>`;}
    else if(!l){close();}
    else{close();out+=`<p>${inline(l)}</p>`;}}
  close();return out;
}

  add(a){const d=S.days.get(S.cur);d[a.dataset.list].push(a.dataset.list==='relax'?{text:'',done:false}:todo());scheduleSave('days',S.cur,300);render();
    const ins=document.querySelectorAll(`[data-b^="days/${S.cur}/${a.dataset.list}."][type=text]`);if(ins.length)ins[ins.length-1].focus();},
  'del-item'(a){const d=S.days.get(S.cur);d[a.dataset.list].splice(+a.dataset.i,1);scheduleSave('days',S.cur,150);render();},
  rate(a){const d=S.days.get(S.cur);const n=+a.dataset.n;d.evening.rating=d.evening.rating===n?0:n;scheduleSave('days',S.cur,150);render();},
  wrate(a){const wid=isoWeek(S.weekMon);const w=S.weeks.get(wid);const n=+a.dataset.n;w.reflection.rating=w.reflection.rating===n?0:n;scheduleSave('weeks',wid,150);render();},
  unlock(){S.unlocked.add(S.cur);render();},
  lock(){S.unlocked.delete(S.cur);render();},
  finish(){S.confirm=true;render();},
  'finish-no'(){S.confirm=false;render();},
  'finish-yes'(){const date=S.cur,d=S.days.get(date),next=addDays(date,1);
    d.status='closed';d.closedAt=Date.now();
    if(!S.days.has(next))S.days.set(next,newDay(next));
    const nd=S.days.get(next);if(nd.status==='closed'){nd.status='open';}
    carry(d,nd);scheduleSave('days',date,60);scheduleSave('days',next,60);
    S.confirm=false;S.cur=next;render();window.scrollTo(0,0);},
  'week-go'(a){S.weekMon=addDays(S.weekMon,+a.dataset.d);render();},
  'week-now'(){S.weekMon=mondayOf(S.date);render();},
  wh(a){const date=a.dataset.date,hid=a.dataset.h;let d=S.days.get(date);
    if(!d){d=newDay(date);if(date<S.date)d.status='closed';S.days.set(date,d);}
    d.habits[hid]=a.checked;scheduleSave('days',date,150);},
  vpick(a){const v=profile().values,x=a.dataset.v;if(v.selected.includes(x)){v.selected=v.selected.filter(y=>y!==x);v.top=v.top.filter(y=>y!==x);}else if(v.selected.length<10)v.selected.push(x);scheduleSave('meta','profile',300);render();},
  vadd(){const el=$('#newValue');const x=(el&&el.value||'').trim();if(!x)return;const v=profile().values;if(![...VALUES,...v.custom].some(y=>y.toLowerCase()===x.toLowerCase()))v.custom.push(x);if(!v.selected.includes(x)&&v.selected.length<10)v.selected.push(x);scheduleSave('meta','profile',300);render();},
  vstar(a){const v=profile().values,x=a.dataset.v;if(v.top.includes(x))v.top=v.top.filter(y=>y!==x);else if(v.top.length<5)v.top.push(x);scheduleSave('meta','profile',300);render();},
  pair(a){profile().values.pairs[a.dataset.k]=a.dataset.v;scheduleSave('meta','profile',300);render();},
  vstatus(a){const st=profile().values.status;st[a.dataset.v]=st[a.dataset.v]===a.dataset.s?'':a.dataset.s;scheduleSave('meta','profile',300);render();},
  hadd(){const el=$('#newHabit');const x=(el&&el.value||'').trim();if(!x)return;profile().habits.push({id:'h'+Date.now().toString(36),name:x});scheduleSave('meta','profile',150);render();},
  hdel(a){profile().habits.splice(+a.dataset.i,1);scheduleSave('meta','profile',150);render();},
  range(a){S.range=a.dataset.r==='all'?'all':+a.dataset.r;render();},
  'copy-prompt'(){const t=buildPrompt();S.copyText='';
    const fallback=()=>{S.copyText=t;render();const el=$('#copyText');if(el){el.focus();el.select();}};
    try{navigator.clipboard.writeText(t).then(()=>{const o=$('#ai-out');if(o)o.innerHTML='<p class="muted">Copied. Paste it into a new Claude chat.</p>';},fallback);}catch(e){fallback();}},
  async backup(){
    try{await store.writeText('backups',backupName(),backupJSON());S.backupMsg=`Snapshot saved as backups/${backupName()}.`;}
    catch(e){S.backupMsg='The snapshot could not be saved. Check that the folder still exists.';}
    render();},
  async 'open-folder'(){try{await NATIVE.OpenFolder();}catch(e){}},
  async signin(){parkPending();await Auth.login();},
  signout(){Auth.signOut();},
  async connect(a){
    S.connectMsg='';
    if(NATIVE){
      if(Object.keys(saveQ).length){S.connectMsg='Wait a moment until all changes are saved.';render();return;}
      try{const p=await NATIVE.ChooseFolder();if(p) return openFolder({name:p.split('\\').pop(),path:p});}
      catch(e){S.connectMsg='The folder could not be opened. Choose it again.';render();}
      return;
    }
    try{
      if(S.savedDir&&a.dataset.mode!=='pick'){
        const p=await S.savedDir.requestPermission({mode:'readwrite'});
        if(p==='granted') return openFolder(S.savedDir);
      }
      const h=await window.showDirectoryPicker({id:'smj6-journal',mode:'readwrite'});
      await IDB.set('dir',h); S.savedDir=h; return openFolder(h);
    }catch(e){if(e&&e.name!=='AbortError'){S.connectMsg='The folder could not be opened. Try again or choose the folder again.';render();}}
  },
  'restore-no'(){S.restore=null;render();},
  async 'restore-yes'(){const o=S.restore.data;S.restore=null;S.restoreMsg='Restoring…';render();let n=0,fail=0;
    for(const c of COLS){const src=o[c]||{};for(const [id,data] of Object.entries(src)){if(!data||typeof data!=='object')continue;
      if(c==='days')normDay(data);if(c==='weeks')normWeek(data);S[c].set(id,data);
      try{await store.set(c,id,JSON.parse(JSON.stringify(data)));n++;}catch(e){fail++;}}}
    S.restoreMsg=`Restored ${n} items.${fail?` ${fail} could not be saved.`:''}`;ensureTimeline();render();},
  retry(){if(CLOUD_MODE&&S.needLogin){A.signin();return;}
    for(const k of Object.keys(saveQ)){const [c,id]=k.split('/');saveQ[k].failed=false;flush(c,id);}}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.disabled)return;const f=A[a.dataset.act];if(f)f(a,e);});

/* ---------- boot ---------- */
// Reads every collection into fresh maps first, so a failed read never wipes what is on screen.
async function loadAll(){
  const next={};for(const c of COLS){next[c]=new Map();for(const {id,data} of await store.all(c))next[c].set(id,data);}
  for(const c of COLS)S[c]=next[c];
  for(const d of S.days.values())normDay(d);
  for(const w of S.weeks.values())normWeek(w);
}
async function openFolder(h){
  const prev=store;S.dir=h;store=NATIVE?nativeStore():CLOUD_MODE?graphStore():fsStore(h);
  $('#main').innerHTML=`<p class="loading">${CLOUD_MODE?'Loading your journal from OneDrive…':'Reading your journal folder…'}</p>`;
  try{await loadAll();}
  catch(e){console.warn('folder read failed',e);store=prev;
    S.connectMsg=CLOUD_MODE?(e&&e.code==='auth'?'Your sign-in has expired. Sign in again.':'Your OneDrive could not be read. Check the internet connection and sign in again.')
      :'The folder could not be read. Choose the Daily Plans folder again.';
    render();return;}
  if(CLOUD_MODE) restorePending();
  ensureTimeline();refreshStatus();render();
}
async function boot(){
  const t=lsGet('smj6:tab');if(t&&['day','week','progress','me','history'].includes(t))S.tab=t;
  if(CLOUD_MODE){
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
    Auth.load();
    let r='none';
    try{r=await Auth.handleRedirect();}catch(e){console.warn('sign-in failed',e);S.connectMsg='Sign-in did not complete: '+(e.message||'unknown error');}
    if(r==='none'&&Auth.t&&!(await Auth.token())&&!lsGet('smj6:silent')){
      // Session ran out: try one silent sign-in (no prompt) before showing the button.
      lsSet('smj6:silent','1');return Auth.login('none');
    }
    try{localStorage.removeItem('smj6:silent');}catch(e){}
    if(await Auth.token()) return openFolder({name:'OneDrive',path:'OneDrive › Apps › 6-Minute Journal'});
    return render();
  }
  if(NATIVE){
    $('[data-tab="history"]').textContent='Archive & settings';
    try{S.settings=JSON.parse(await NATIVE.GetSettings());const f=await NATIVE.GetFolder();
      if(f) return openFolder({name:f.split('\\').pop(),path:f});}
    catch(e){console.warn('host not ready',e);S.connectMsg='The journal folder could not be read. Choose it again.';}
    return render();
  }
  if('showDirectoryPicker' in window){
    S.savedDir=await IDB.get('dir');
    if(S.savedDir){let p='prompt';try{p=await S.savedDir.queryPermission({mode:'readwrite'});}catch(e){}
      if(p==='granted') return openFolder(S.savedDir);}
  }
  render();
}
boot();
})();
</script>
